<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Agent 工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Zm2.2 1.2v2.1h11.6V7.7H6.2Zm0 4.1v2.1h7.4v-2.1H6.2Z"/></svg>
        </div>
        <div>
          <p class="brand-name">Agent</p>
          <p class="brand-caption">工作台</p>
        </div>
      </div>
      <nav class="side-nav" aria-label="功能菜单">
        <button type="button" class="nav-item active" data-view="database" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
          数据库
        </button>
        <button type="button" class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg>
          设置
        </button>
      </nav>
      <div class="sidebar-footer">
        <p>设置保存在 web_settings.json</p>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="breadcrumb">工作空间 <span>/</span> <span id="crumb-page">数据库</span></p>
          <h1 id="page-title">数据库</h1>
        </div>
        <div class="topbar-status"><span class="status-dot"></span><span id="status" role="status">正在连接</span></div>
      </header>

      <section id="view-database" class="view">
        <form id="task-form" class="panel composer">
          <label for="message">查询</label>
          <textarea id="message" name="message" required placeholder="例如：列出 public 下的表"></textarea>
          <div class="actions">
            <button id="start" type="submit">运行</button>
            <button id="reset" type="button" class="secondary">清空</button>
          </div>
          <p id="plan-hint" class="field-hint" hidden>当前权限是只读计划，不能查询数据库。请到设置里改为「默认」。</p>
        </form>
        <section class="panel log-panel" aria-labelledby="log-title">
          <div class="panel-heading">
            <h2 id="log-title">运行日志</h2>
            <span class="live-label"><i></i>实时</span>
          </div>
          <pre id="log">还没有任务。等待你的指令…</pre>
        </section>
        <section class="panel files-panel" aria-labelledby="files-title">
          <div class="panel-heading">
            <h2 id="files-title">文件</h2>
            <nav id="crumbs" class="crumbs" aria-label="当前目录"></nav>
          </div>
          <div id="files" class="file-grid"></div>
        </section>
      </section>

      <section id="view-settings" class="view" hidden>
        <form id="settings-form" class="panel settings-panel">
          <p class="field-hint">保存后写入项目根目录的 web_settings.json，下次启动会继续使用。</p>
          <label for="provider">模型服务</label>
          <select id="provider" name="provider" required></select>
          <label for="max-rounds">最大轮次</label>
          <input id="max-rounds" name="max_rounds" type="number" min="1" max="1000" required>
          <label for="permission">权限</label>
          <select id="permission" name="permission" required>
            <option value="plan">只读计划</option>
            <option value="default">默认</option>
            <option value="accept-edits">允许执行命令</option>
          </select>
          <label for="timeout">请求超时（秒）</label>
          <input id="timeout" name="timeout" type="number" min="1" max="3600" required>
          <div class="actions">
            <button id="save-settings" type="submit">保存</button>
          </div>
          <p id="settings-note" class="field-hint" role="status"></p>
        </form>
      </section>
    </main>
  </div>
  <dialog id="preview">
    <form method="dialog"><button type="submit" class="secondary">关闭</button></form>
    <img id="preview-image" alt="">
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
