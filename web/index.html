<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 自动化</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <header class="brand">
        <p class="eyebrow">工作区 Agent</p>
        <h1>自动化任务</h1>
        <p class="status" id="status" role="status">正在连接</p>
        <!--<p class="hint">一次只跑一个任务。执行过程、结果和截图显示在右侧。</p>-->
      </header>

      <form id="task-form">
        <label for="provider">大模型服务</label>
        <select id="provider" name="provider" required></select>

        <label for="message">任务</label>
        <textarea id="message" name="message" required placeholder="先登录，然后打开建筑物菜单，搜索小区并打开详情，返回小区 id"></textarea>

        <div class="actions">
          <button id="start" type="submit">开始执行</button>
          <button id="reset" type="button">清空对话</button>
        </div>
      </form>
    </aside>

    <main class="work" aria-live="polite">
      <article class="panel">
        <h2>执行过程</h2>
        <pre id="log">还没有任务。</pre>
      </article>
      <article class="panel">
        <h2>结果</h2>
        <div id="reply" class="reply">结果会显示在这里。</div>
      </article>
      <article class="panel">
        <h2>页面截图</h2>
        <div id="shots" class="shots"></div>
      </article>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
